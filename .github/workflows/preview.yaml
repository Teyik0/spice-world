name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.number }}

env:
  BUN_VERSION: 1.4.5
  STAGE: pr-${{ github.event.number }}
  PR_SHA: ${{ github.event.pull_request.head.sha }}
  NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
  NEON_API: https://console.neon.tech/api/v2/projects/${{ vars.NEON_PROJECT_ID }}
  VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
  VERCEL_SERVER_PROJECT_ID: ${{ vars.VERCEL_SERVER_PROJECT_ID }}
  PREVIEW_DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      # Anonymized fork of main, created once per PR and kept across pushes.
      - name: Create anonymized PR database
        run: |
          neon() { curl -sSf -H "Authorization: Bearer $NEON_API_KEY" -H 'Content-Type: application/json' "$@"; }
          id=$(neon "$NEON_API/branches" | jq -r --arg n "$STAGE" '.branches[] | select(.name == $n) | .id')
          if [ -z "$id" ]; then
            id=$(jq --arg n "$STAGE" '{ branch: { name: $n }, start_anonymization: true,
                   masking_rules: map({ database_name: "neondb", schema_name: "public" } + .) }' .github/neon/masking-rules.json \
              | neon -X POST "$NEON_API/branch_anonymized" -d @- | jq -r .branch.id)
          fi
          for _ in $(seq 60); do
            state=$(neon "$NEON_API/branches/$id/anonymized_status" | jq -r .state)
            case $state in
              anonymized) break ;;
              error|initialization_error) echo "Anonymization failed"; exit 1 ;;
            esac
            sleep 10
          done
          test "$state" = anonymized || { echo "Anonymization timed out ($state)"; exit 1; }
          host=$(neon "$NEON_API/branches/$id/endpoints" | jq -r '.endpoints[0].host')
          url=$(bun -e 'const u = new URL(process.env.PREVIEW_DATABASE_URL); u.host = process.argv[1]; console.log(u.href)' "$host")
          echo "::add-mask::$url"
          echo "PR_DATABASE_URL=$url" >> "$GITHUB_ENV"

      # Before the Vercel deployment builds against it.
      - name: Migrate PR database
        working-directory: apps/server
        run: DATABASE_URL=$PR_DATABASE_URL bun run db:migrate

      - run: bunx sst deploy --stage $STAGE

  remove:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - run: bunx sst remove --stage $STAGE

      - name: Delete PR database
        run: |
          neon() { curl -sSf -H "Authorization: Bearer $NEON_API_KEY" "$@"; }
          neon "$NEON_API/branches" | jq -r --arg n "$STAGE" '.branches[] | select(.name == $n) | .id' \
            | xargs -r -I{} curl -sSf -X DELETE -H "Authorization: Bearer $NEON_API_KEY" "$NEON_API/branches/{}" > /dev/null
